name: Request a feature
description: An endpoint, model, rotation strategy, or integration you want.
title: "[feat] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? API shape, config keys, defaults.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [pooling/rotation, tool protocol, vision, quota/health, opencode wiring, docs, other]
    validations:
      required: false
